name: Build PotatoPack

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"   # every Monday: check for mod updates

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Sync mods from mods.txt
        run: bash scripts/sync-mods.sh

      - name: Update mods (weekly run only)
        if: github.event_name == 'schedule'
        run: packwiz update --all -y && packwiz refresh

      - name: Commit updated mod files
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync mods" && git push)

      - name: Export .mrpack
        run: |
          packwiz modrinth export -o PotatoPack.mrpack
          ls -lh PotatoPack.mrpack

      - uses: actions/upload-artifact@v4
        with:
          name: PotatoPack
          path: PotatoPack.mrpack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PotatoPack.mrpack
